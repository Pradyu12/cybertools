[package]
name = "wifiti"
version = "0.1.0"
edition = "2021"
description = "Wifiti — a wifite-style Wi-Fi auditing toolkit in Rust: AP scanning, live signal monitoring, and pure-Rust PMKID cracking."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
